<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم العملات الرقمية</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
    body{background:#0a0f1e;color:#fff;padding:0}
    
    /* القائمة الجديدة */
    .navbar{background:#121a2f;padding:15px;display:flex;justify-content:center;gap:20px;border-bottom:1px solid #2a3a6b}
    .navbar button{background:none;border:none;color:#aaa;font-size:16px;cursor:pointer;padding:10px 20px;border-radius:8px}
    .navbar button.active{color:#00e5ff;background:#1c2642}
    
    .container{max-width:900px;margin:20px auto;background:#121a2f;border-radius:16px;padding:30px;box-shadow:0 0 20px rgba(0,255,255,0.1)}
    h1{text-align:center;color:#00e5ff;margin-bottom:20px}
    .input-group{margin-bottom:20px}
    label{display:block;margin-bottom:8px;color:#aaa;font-size:14px}
    input{width:100%;padding:12px;background:#1c2642;border:1px solid #2a3a6b;border-radius:8px;color:#fff;font-size:16px}
    input:focus{outline:none;border-color:#00e5ff}
    button.calc{width:100%;padding:14px;background:linear-gradient(90deg,#00e5ff,#00b8d4);border:none;border-radius:8px;color:#000;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
    button.calc:hover{opacity:0.9}
    .result{background:#1c2642;padding:15px;border-radius:8px;margin-top:20px;border-right:3px solid #00e5ff}
    .result p{margin:8px 0;font-size:15px}
    .profit{color:#00ff88}.loss{color:#ff5252}
    .page{display:none}
    .page.active{display:block}

    /* جدول الاسعار */
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{padding:12px;text-align:center;border-bottom:1px solid #2a3a6b}
    th{color:#00e5ff}
    .price-up{color:#00ff88}
    .price-down{color:#ff5252}
</style>
</
